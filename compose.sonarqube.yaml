name: mcp-resume-sonar

services:
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    read_only: true
    depends_on:
      db:
        condition: service_healthy

    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SONAR_JDBC_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp

    tmpfs:
      - /tmp

    ports:
      - '${SONAR_PORT:-9000}:9000'

    networks:
      - sonarnet

  db:
    image: postgres:18
    container_name: sonarqube_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}

    volumes:
      - postgresql_data:/var/lib/postgresql

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - sonarnet

volumes:
  sonarqube_data:
    name: mcp_resume_sonarqube_data
  sonarqube_extensions:
    name: mcp_resume_sonarqube_extensions
  sonarqube_logs:
    name: mcp_resume_sonarqube_logs
  sonarqube_temp:
    name: mcp_resume_sonarqube_temp
  postgresql_data:
    name: mcp_resume_postgresql_data

networks:
  sonarnet:
    driver: bridge
