services:
  app:
    image: ${REGISTRY_URL}/${IMAGE_NAME}:${IMAGE_TAG}
    container_name: ${IMAGE_NAME}
    restart: unless-stopped

    ports:
      - '${APP_PORT:-3000}:3000'

    environment:
      NODE_ENV: production
      PORT: 3000
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:?MCP_ALLOWED_HOSTS is required}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:?MCP_ALLOWED_ORIGINS is required}

    security_opt:
      - no-new-privileges:true
    read_only: true

    tmpfs:
      - /tmp

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: 'json-file'
      options:
        max-file: '3'
        max-size: 10m
